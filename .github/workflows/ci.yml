name: CI

# Gates every push and PR on the invariant suite + a clean production build.
# If a change breaks one of the 9 compliance/safety invariants, this fails.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hireright-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hireright-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run invariant tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Build must not depend on real secrets; the app falls back to the
          # deterministic mock AI and in-memory store when these are unset.
          NODE_ENV: production
